<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Store Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- ✅ External CSS -->
    <link rel="stylesheet" th:href="@{/css/medical-store.css}">
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->


        <div th:replace="~{fragments/sidebar :: sidebar}"></div>


        <!-- Main content -->
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 bg-light" style="min-height: 100vh; width: 998px;">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <h1 class="h2 text-primary">
                    <i class="fas fa-tachometer-alt me-2"></i> Inventory Dashboard
                </h1>
                <div class="btn-toolbar mb-2 mb-md-0">
                    <span class="text-muted" th:text="'Welcome to Medical Store System'"></span>
                </div>
            </div>

            <!-- Statistics Cards -->

            <div th:replace="~{fragments/inventory-summary :: inventory-summary}"></div>

            <!-- Low Stock Table -->
            <div class="card mt-4 shadow">



                <div id="inventoryTableSection" style="display:none;">

                    <div class="card mt-4">

                        <div class="card-header d-flex justify-content-between align-items-center">
                            <h5 id="tableTitle" class="mb-0">Inventory Details</h5>

                            <button class="btn btn-sm btn-danger"
                                    onclick="hideInventoryTable()">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>

                        <div class="card-body">

                            <table class="table table-bordered">

                                <thead id="tableHead"></thead>

                                <tbody id="tableBody"></tbody>

                            </table>

                        </div>

                    </div>

                </div>
            <div class="card mt-4 shadow">

                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0">
                        <i class="fas fa-history"></i>
                        Recent Inventory Activities
                    </h5>
                </div>
                <div id="content"></div>
                <div id="inventoryTable"></div>
                 <!-- <div class="card-body">

                    <table class="table table-bordered">

                        <thead>
                        <tr>
                            <th>Date</th>
                            <th>Medicine</th>
                            <th>Type</th>
                            <th>Quantity</th>
                        </tr>
                        </thead>

                        <tbody>

                        <tr th:each="tx : ${recentTransactions}">
                            <td th:text="${tx.transactionDate}"></td>
                            <td th:text="${tx.medicine.name}"></td>
                            <td th:text="${tx.type}"></td>
                            <td th:text="${tx.quantity}"></td>
                        </tr>

                        </tbody>

                    </table>

                </div>-->
                <div id="contentArea"></div>
                <div id="content-area"></div>
                <div class="modal fade"
                     id="adjustmentModal"
                     tabindex="-1">

                    <div class="modal-dialog">
                        <div class="modal-content">

                            <div class="modal-header">
                                <h5 class="modal-title">
                                    Inventory Adjustment
                                </h5>

                                <button type="button"
                                        class="btn-close"
                                        data-bs-dismiss="modal">
                                </button>
                            </div>

                            <div class="modal-body">

                                <div class="mb-3">
                                    <label>Medicine</label>

                                    <select id="medicineId"
                                            class="form-select">

                                        <option value="">
                                            Select Medicine
                                        </option>

                                        <option th:each="medicine : ${medicines}"
                                                th:value="${medicine.id}"
                                                th:text="${medicine.name}">
                                        </option>

                                    </select>
                                </div>

                                <div class="mb-3">
                                    <label>Adjustment Type</label>

                                    <select id="adjustmentType"
                                            class="form-select">

                                        <option value="DAMAGE">Damage</option>
                                        <option value="EXPIRED">Expired</option>
                                        <option value="LOST">Lost</option>
                                        <option value="STOCK_COUNT_CORRECTION">
                                            Stock Correction
                                        </option>

                                    </select>
                                </div>

                                <div class="mb-3">
                                    <label>Quantity</label>

                                    <input type="number"
                                           id="quantity"
                                           class="form-control">
                                </div>

                                <div class="mb-3">
                                    <label>Reason</label>

                                    <textarea id="reason"
                                              class="form-control"></textarea>
                                </div>

                            </div>

                            <div class="modal-footer">

                                <button class="btn btn-secondary"
                                        data-bs-dismiss="modal">
                                    Close
                                </button>

                                <button class="btn btn-primary"
                                        onclick="saveAdjustment()">
                                    Save
                                </button>

                            </div>

                        </div>
                    </div>
                </div>
            </div>
            </div>
        </main>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<script th:src="@{/js/inventory.js}"></script>
<script th:src="@{/js/medical-store.js}"></script>
</body>
</html>
