<div th:fragment="medicineTable">

    <div class="table-responsive">

        <table class="table table-striped table-hover customer-table">

            <thead>
            <tr>
                <th>Name</th>
                <th>Type</th>
                <th>Batch</th>
                <th>Price</th>
                <th>Quantity</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="medicine : ${medicinePage.content}">
                <td th:text="${medicine.name}"></td>
                <td th:text="${medicine.type}"></td>
                <td th:text="${medicine.batchNumber}"></td>
                <td>₹ <span th:text="${medicine.price}"></span></td>

                <td>
                    <span th:if="${medicine.quantity < 10}"
                          class="badge bg-warning text-dark"
                          th:text="${medicine.quantity}">
                    </span>

                    <span th:unless="${medicine.quantity < 10}"
                          class="badge bg-success"
                          th:text="${medicine.quantity}">
                    </span>
                </td>
            </tr>

            <tr th:if="${medicinePage.content.isEmpty()}">
                <td colspan="5" class="text-center text-muted">
                    No medicines found
                </td>
            </tr>

            </tbody>

        </table>

    </div>

    <!-- Pagination -->
    <nav th:if="${medicinePage.totalPages > 1}">
        <ul class="pagination pagination-sm justify-content-center">

            <!-- Previous -->
            <li class="page-item"
                th:classappend="${medicinePage.first} ? 'disabled'">

                <a class="page-link"
                   href="javascript:void(0)"
                   th:if="${!medicinePage.first}"
                   th:onclick="'loadMedicinePage(' + ${medicinePage.number - 1} + ')'">
                    Previous
                </a>

                <span class="page-link"
                      th:if="${medicinePage.first}">
                    Previous
                </span>

            </li>

            <!-- Page Numbers -->
            <li class="page-item"
                th:each="i : ${#numbers.sequence(0, medicinePage.totalPages - 1)}"
                th:classappend="${i == medicinePage.number} ? 'active'">

                <a class="page-link"
                   href="javascript:void(0)"
                   th:text="${i + 1}"
                   th:onclick="'loadMedicinePage(' + ${i} + ')'">
                </a>

            </li>

            <!-- Next -->
            <li class="page-item"
                th:classappend="${medicinePage.last} ? 'disabled'">

                <a class="page-link"
                   href="javascript:void(0)"
                   th:if="${!medicinePage.last}"
                   th:onclick="'loadMedicinePage(' + ${medicinePage.number + 1} + ')'">
                    Next
                </a>

                <span class="page-link"
                      th:if="${medicinePage.last}">
                    Next
                </span>

            </li>

        </ul>
    </nav>

</div>
