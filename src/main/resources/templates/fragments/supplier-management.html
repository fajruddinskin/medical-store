<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Supplier Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/medical-store.css}">
</head>

<body>

<div class="container-fluid">

    <div class="row">

        <!-- Sidebar -->
        <div class="col-md-2 p-0">
            <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        </div>

        <!-- Main Content -->
        <div class="col-md-10">

            <div class="container mt-4">

                <h3 class="mb-4">
                    <i class="fas fa-truck me-2"></i>
                    Supplier Management
                </h3>

                <!-- Supplier Form -->


                <!-- Search Box -->
                <div class="row mb-3 align-items-center">

                    <div class="col-md-2 mb-3">
                        <div class="card border-success shadow-sm"
                             style="cursor:pointer"
                             onclick="loadSuppliers()">

                            <div class="card-body text-center">
                                <i class="fas fa-truck fa-2x text-success mb-2"></i>
                                <h6>Total Suppliers</h6>
                                <h3 th:text="${totalSuppliers}">0</h3>
                                <small class="text-muted">
                                    Click to View All
                                </small>
                            </div>

                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card border-primary shadow-sm"
                             style="cursor:pointer;"
                             onclick="showSupplierForm()">

                            <div class="card-body text-center">

                                <i class="fas fa-user-plus fa-2x text-primary mb-2"></i>

                                <h6>Add Supplier</h6>

                                <h3>+</h3>

                                <small class="text-muted">
                                    Click to Add New
                                </small>

                            </div>

                        </div>
                    </div>
                    <div class="col-md-4 ms-auto position-relative">

                        <input type="text"
                               id="supplierSearch"
                               class="form-control"
                               placeholder="Search Supplier..."
                               onkeyup="showSuggestions(this.value)">

                        <div id="suggestionBox" class="suggestion-box list-group"></div>

                    </div>
                </div>
                <div id="supplierFormSection"></div>
                <!-- Supplier List -->
                <div id="contentArea"></div>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<script th:src="@{/js/inventory.js}"></script>


</body>
</html>
